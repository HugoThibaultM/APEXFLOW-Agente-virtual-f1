<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ApexFlow - Comparativa de Vueltas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style> body { background-color: #0f172a; color: white; } </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">🏎️ ApexFlow <span class="text-slate-400">Comparison</span></h1>
                <p id="infoText" class="text-sm text-slate-400 mt-1">Selecciona una sesión para comparar</p>
            </div>
            
            <!-- Controles de Comparativa -->
            <div class="flex gap-3 items-center">
                <select id="sessionSelect" onchange="onSessionChange()" class="bg-slate-800 text-white p-2 rounded border border-slate-600 outline-none text-sm">
                    <option value="">-- Sesión --</option>
                </select>

                <div class="flex flex-col">
                    <span class="text-[10px] text-slate-400">Tu Vuelta:</span>
                    <select id="lap1Select" onchange="loadComparison()" class="bg-slate-800 text-green-400 font-bold p-2 rounded border border-slate-600 outline-none text-sm">
                        <option value="">-</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <span class="text-[10px] text-slate-400">Referencia (Pro):</span>
                    <select id="lap2Select" onchange="loadComparison()" class="bg-slate-800 text-orange-400 font-bold p-2 rounded border border-slate-600 outline-none text-sm">
                        <option value="">-</option>
                    </select>
                </div>
            </div>
        </header>
        
        <div class="bg-slate-800 p-6 rounded-xl shadow-2xl">
            <canvas id="historyChart" height="120"></canvas>
        </div>
    </div>

    <script>
        let historyChart;
        let currentSessionId = "";

        window.onload = async function() {
            const res = await fetch('/api/sessions');
            const data = await res.json();
            const select = document.getElementById('sessionSelect');
            select.innerHTML = '<option value="">-- Elige una Sesión --</option>';
            
            data.sessions.forEach(session => {
                const opt = document.createElement('option');
                opt.value = session;
                const date = new Date(parseInt(session.split('_')[1]) * 1000);
                opt.text = `Sesión del ${date.toLocaleTimeString()}`;
                select.appendChild(opt);
            });
        };

        async function onSessionChange() {
            currentSessionId = document.getElementById('sessionSelect').value;
            if (!currentSessionId) return;

            const res = await fetch(`/api/telemetry/${currentSessionId}/laps`);
            const data = await res.json();
            
            const lap1Select = document.getElementById('lap1Select');
            const lap2Select = document.getElementById('lap2Select');
            lap1Select.innerHTML = '';
            lap2Select.innerHTML = '';

            if (data.error) return;

            data.laps.forEach(item => {
                // Llenamos el desplegable 1 (Tu vuelta - por defecto la mejor)
                const opt1 = document.createElement('option');
                opt1.value = item.lap;
                opt1.text = `Vuelta ${item.lap} (${item.duration}s)`;
                if (item.lap === data.best_lap) opt1.selected = true;
                lap1Select.appendChild(opt1);

                // Llenamos el desplegable 2 (Referencia - por defecto la misma o la primera)
                const opt2 = document.createElement('option');
                opt2.value = item.lap;
                opt2.text = `Vuelta ${item.lap} (${item.duration}s)`;
                lap2Select.appendChild(opt2);
            });

            loadComparison();
        }

        async function loadComparison() {
            const lap1 = document.getElementById('lap1Select').value;
            const lap2 = document.getElementById('lap2Select').value;
            if (!currentSessionId || !lap1 || !lap2) return;

            const res = await fetch(`/api/telemetry/${currentSessionId}/compare?lap1=${lap1}&lap2=${lap2}`);
            const data = await res.json();

            document.getElementById('infoText').innerText = `Comparando Vuelta #${lap1} (Verde) vs Vuelta #${lap2} (Naranja)`;
            drawComparisonChart(data.lap1, data.lap2);
        }

        function drawComparisonChart(l1, l2) {
            const ctx = document.getElementById('historyChart').getContext('2d');
            if (historyChart) historyChart.destroy();

            historyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: l1.distances, // Usamos los metros de la pista como eje X común
                    datasets: [
                        { label: `Velocidad Vuelta ${l1.number} (km/h)`, borderColor: '#4ade80', data: l1.speed, tension: 0.1, pointRadius: 0, borderWidth: 2 },
                        { label: `Velocidad Vuelta ${l2.number} (Pro/Ref)`, borderColor: '#fb923c', data: l2.speed, tension: 0.1, pointRadius: 0, borderWidth: 2, borderDash: [4, 4] }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { min: 0, max: 350, title: { display: true, text: 'Velocidad (km/h)' } },
                        x: { ticks: { maxTicksLimit: 15 }, title: { display: true, text: 'Distancia en Pista (Metros)' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
