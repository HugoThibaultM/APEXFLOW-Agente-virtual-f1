<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ApexFlow - Historial de Sesiones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style> body { background-color: #0f172a; color: white; } </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-bold text-blue-400">🏎️ ApexFlow <span class="text-slate-400">Analysis</span></h1>
            
            <!-- Selector de Sesiones -->
            <div class="flex gap-4 items-center">
                <label for="sessionSelect" class="text-slate-400 text-sm">Sesión:</label>
                <select id="sessionSelect" class="bg-slate-800 text-white p-2 rounded border border-slate-600 outline-none">
                    <option value="">Cargando sesiones...</option>
                </select>
                <button onclick="loadSession()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded transition-colors font-bold">
                    Cargar Telemetría
                </button>
            </div>
        </header>
        
        <div class="bg-slate-800 p-6 rounded-xl shadow-2xl">
            <canvas id="historyChart" height="120"></canvas>
        </div>
    </div>

    <script>
        let historyChart; // Variable global para el gráfico

        // 1. Al cargar la página, pedimos a la API la lista de sesiones
        window.onload = async function() {
            try {
                const response = await fetch('/api/sessions');
                const data = await response.json();
                const select = document.getElementById('sessionSelect');
                
                select.innerHTML = ''; // Limpiamos el texto de carga
                
                if (data.sessions.length === 0) {
                    select.innerHTML = '<option value="">No hay datos guardados</option>';
                    return;
                }

                // Llenamos el desplegable
                data.sessions.forEach(session => {
                    const option = document.createElement('option');
                    option.value = session;
                    // Hacemos el ID más legible para el usuario
                    const date = new Date(parseInt(session.split('_')[1]) * 1000);
                    option.text = `Sesión: ${date.toLocaleString()}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Error cargando sesiones:", error);
            }
        };

        // 2. Función para cargar los datos de la sesión seleccionada
        async function loadSession() {
            const sessionId = document.getElementById('sessionSelect').value;
            if (!sessionId) return;

            try {
                const response = await fetch(`/api/telemetry/${sessionId}`);
                const data = await response.json();

                drawChart(data.labels, data.speed, data.brake);
            } catch (error) {
                console.error("Error cargando telemetría:", error);
            }
        }

        // 3. Dibujar o actualizar el gráfico de Chart.js
        function drawChart(labels, speedData, brakeData) {
            const ctx = document.getElementById('historyChart').getContext('2d');
            
            // Si ya existe un gráfico, lo destruimos para dibujar el nuevo limpio
            if (historyChart) {
                historyChart.destroy();
            }

            historyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Velocidad (km/h)', borderColor: '#4ade80', backgroundColor: 'rgba(74, 222, 128, 0.1)', fill: true, data: speedData, tension: 0.1, yAxisID: 'y', pointRadius: 0 },
                        { label: 'Freno (0-1)', borderColor: '#f87171', backgroundColor: 'rgba(248, 113, 113, 0.1)', fill: true, data: brakeData, tension: 0.1, yAxisID: 'y1', pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false }, // Permite ver los datos al pasar el ratón
                    scales: {
                        y: { min: 0, max: 350, position: 'left' },
                        y1: { min: 0, max: 1.2, position: 'right', grid: { drawOnChartArea: false } },
                        x: { ticks: { maxTicksLimit: 20 } } // No saturar el eje X con miles de segundos
                    }
                }
            });
        }
    </script>
</body>
</html>
