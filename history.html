<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ApexFlow - Selector de Vueltas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style> body { background-color: #0f172a; color: white; } </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">🏎️ ApexFlow <span class="text-slate-400">Analysis</span></h1>
                <p id="infoText" class="text-sm text-slate-400 mt-1">Selecciona una sesión</p>
            </div>
            
            <!-- Controles de Vueltas -->
            <div class="flex gap-3 items-center">
                <select id="sessionSelect" onchange="onSessionChange()" class="bg-slate-800 text-white p-2 rounded border border-slate-600 outline-none text-sm">
                    <option value="">Cargando sesiones...</option>
                </select>

                <select id="lapSelect" onchange="loadSelectedLap()" class="bg-slate-800 text-white p-2 rounded border border-slate-600 outline-none text-sm">
                    <option value="">Selecciona sesión primero</option>
                </select>
            </div>
        </header>
        
        <div class="bg-slate-800 p-6 rounded-xl shadow-2xl">
            <canvas id="historyChart" height="120"></canvas>
        </div>
    </div>

    <script>
        let historyChart;
        let currentSessionId = "";

        // 1. Cargar lista de sesiones al iniciar
        window.onload = async function() {
            const res = await fetch('/api/sessions');
            const data = await res.json();
            const select = document.getElementById('sessionSelect');
            select.innerHTML = '<option value="">-- Elige una Sesión --</option>';
            
            data.sessions.forEach(session => {
                const opt = document.createElement('option');
                opt.value = session;
                const date = new Date(parseInt(session.split('_')[1]) * 1000);
                opt.text = `Sesión del ${date.toLocaleTimeString()}`;
                select.appendChild(opt);
            });
        };

        // 2. Al cambiar de sesión, cargamos sus vueltas disponibles
        async function onSessionChange() {
            currentSessionId = document.getElementById('sessionSelect').value;
            if (!currentSessionId) return;

            const res = await fetch(`/api/telemetry/${currentSessionId}/laps`);
            const data = await res.json();
            const lapSelect = document.getElementById('lapSelect');
            lapSelect.innerHTML = '';

            if (data.error) {
                lapSelect.innerHTML = '<option>Sin vueltas</option>';
                return;
            }

            // Llenamos el desplegable con todas las vueltas
            data.laps.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.lap;
                
                // Si es la mejor vuelta, la marcamos visualmente
                if (item.lap === data.best_lap) {
                    opt.text = `⭐ Vuelta ${item.lap} (Más rápida: ${item.duration}s)`;
                    opt.selected = true; // Seleccionada por defecto
                } else {
                    opt.text = `Vuelta ${item.lap} (${item.duration}s)`;
                }
                lapSelect.appendChild(opt);
            });

            // Cargamos automáticamente la mejor vuelta seleccionada
            loadSelectedLap();
        }

        // 3. Cargar los datos de la vuelta elegida en el desplegable
        async function loadSelectedLap() {
            const lapNumber = document.getElementById('lapSelect').value;
            if (!currentSessionId || !lapNumber) return;

            const res = await fetch(`/api/telemetry/${currentSessionId}/lap/${lapNumber}`);
            const data = await res.json();

            document.getElementById('infoText').innerText = `Visualizando Vuelta #${data.lap} (Medición por Distancia)`;
            drawChart(data.distances, data.speed, data.brake);
        }

        function drawChart(labels, speedData, brakeData) {
            const ctx = document.getElementById('historyChart').getContext('2d');
            if (historyChart) historyChart.destroy();

            historyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Velocidad (km/h)', borderColor: '#4ade80', backgroundColor: 'rgba(74, 222, 128, 0.1)', fill: true, data: speedData, tension: 0.1, yAxisID: 'y', pointRadius: 0 },
                        { label: 'Freno (0-1)', borderColor: '#f87171', backgroundColor: 'rgba(248, 113, 113, 0.1)', fill: true, data: brakeData, tension: 0.1, yAxisID: 'y1', pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        y: { min: 0, max: 350, position: 'left' },
                        y1: { min: 0, max: 1.2, position: 'right', grid: { drawOnChartArea: false } },
                        x: { ticks: { maxTicksLimit: 15 } }
                    }
                }
            });
        }
    </script>
</body>
</html>
