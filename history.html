<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ApexFlow - Analysis & Comparison</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style> 
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background-color: #050505; 
            color: #e2e8f0; 
        }
        /* Estilizamos las barras de desplazamiento para que encajen en el tema oscuro */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="p-6 h-screen flex flex-col">
    
    <!-- HEADER -->
    <header class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
        <div>
            <h1 class="text-4xl font-bold text-white tracking-wider">APEX<span class="text-blue-600">FLOW</span> <span class="text-gray-600 text-xl">ANALYSIS</span></h1>
            <p id="infoText" class="text-sm text-gray-500 mt-1 uppercase tracking-widest">Selecciona una sesión para comenzar</p>
        </div>
        
        <!-- Controles de Comparativa -->
        <div class="flex gap-4 items-end">
            <div class="flex flex-col gap-1">
                <span class="text-[10px] text-gray-500 uppercase tracking-widest">Archivo de Sesión</span>
                <select id="sessionSelect" onchange="onSessionChange()" class="bg-gray-900 text-white p-2 rounded-lg border border-gray-700 outline-none text-sm w-48 shadow-inner focus:border-blue-500 transition-colors">
                    <option value="">-- Sesión --</option>
                </select>
            </div>

            <div class="flex flex-col gap-1">
                <span class="text-[10px] text-green-500 uppercase tracking-widest font-bold">Tu Vuelta (Verde)</span>
                <select id="lap1Select" onchange="loadComparison()" class="bg-gray-900 text-green-400 font-bold p-2 rounded-lg border border-green-900 outline-none text-sm w-36 shadow-inner focus:border-green-500 transition-colors">
                    <option value="">-</option>
                </select>
            </div>

            <div class="flex flex-col gap-1">
                <span class="text-[10px] text-orange-500 uppercase tracking-widest font-bold">Referencia (Naranja)</span>
                <select id="lap2Select" onchange="loadComparison()" class="bg-gray-900 text-orange-400 font-bold p-2 rounded-lg border border-orange-900 outline-none text-sm w-36 shadow-inner focus:border-orange-500 transition-colors">
                    <option value="">-</option>
                </select>
            </div>
        </div>
    </header>
    
    <!-- GRID DE ANÁLISIS PRINCIPAL -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-2xl flex-grow flex flex-col relative min-h-0">
        <div class="flex justify-between items-end mb-4">
            <span class="text-gray-500 text-xs tracking-widest uppercase">Comparativa de Telemetría (Speed vs Distance)</span>
        </div>
        <div class="flex-grow relative w-full">
            <canvas id="historyChart"></canvas>
        </div>
    </div>

    <!-- LÓGICA DE JAVASCRIPT -->
    <script>
        let historyChart;
        let currentSessionId = "";

        window.onload = async function() {
            const res = await fetch('/api/sessions');
            const data = await res.json();
            const select = document.getElementById('sessionSelect');
            select.innerHTML = '<option value="">-- Elige una Sesión --</option>';
            
            data.sessions.forEach(session => {
                const opt = document.createElement('option');
                opt.value = session;
                const date = new Date(parseInt(session.split('_')[1]) * 1000);
                opt.text = `${date.toLocaleDateString()} - ${date.toLocaleTimeString()}`;
                select.appendChild(opt);
            });
        };

        async function onSessionChange() {
            currentSessionId = document.getElementById('sessionSelect').value;
            if (!currentSessionId) return;

            const res = await fetch(`/api/telemetry/${currentSessionId}/laps`);
            const data = await res.json();
            
            const lap1Select = document.getElementById('lap1Select');
            const lap2Select = document.getElementById('lap2Select');
            lap1Select.innerHTML = '';
            lap2Select.innerHTML = '';

            if (data.error) return;

            data.laps.forEach(item => {
                const opt1 = document.createElement('option');
                opt1.value = item.lap;
                opt1.text = `Vuelta ${item.lap} (${item.duration}s)`;
                if (item.lap === data.best_lap) opt1.selected = true;
                lap1Select.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = item.lap;
                opt2.text = `Vuelta ${item.lap} (${item.duration}s)`;
                lap2Select.appendChild(opt2);
            });

            loadComparison();
        }

        async function loadComparison() {
            const lap1 = document.getElementById('lap1Select').value;
            const lap2 = document.getElementById('lap2Select').value;
            if (!currentSessionId || !lap1 || !lap2) return;

            const res = await fetch(`/api/telemetry/${currentSessionId}/compare?lap1=${lap1}&lap2=${lap2}`);
            const data = await res.json();

            document.getElementById('infoText').innerText = `MODO ANÁLISIS: VUELTA #${lap1} VS VUELTA #${lap2}`;
            drawComparisonChart(data.lap1, data.lap2);
        }

        function drawComparisonChart(l1, l2) {
            const ctx = document.getElementById('historyChart').getContext('2d');
            if (historyChart) historyChart.destroy();

            // Configuración de colores oscuros para la gráfica
            Chart.defaults.color = '#9ca3af';
            Chart.defaults.font.family = "'Rajdhani', sans-serif";

            historyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: l1.distances,
                    datasets: [
                        { 
                            label: `Vuelta ${l1.number} (Tú)`, 
                            borderColor: '#22c55e', 
                            backgroundColor: 'rgba(34, 197, 94, 0.1)', 
                            fill: true,
                            data: l1.speed, 
                            tension: 0.1, 
                            pointRadius: 0, 
                            borderWidth: 2 
                        },
                        { 
                            label: `Vuelta ${l2.number} (Ref)`, 
                            borderColor: '#f97316', 
                            data: l2.speed, 
                            tension: 0.1, 
                            pointRadius: 0, 
                            borderWidth: 2, 
                            borderDash: [5, 5] 
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } },
                        tooltip: { backgroundColor: 'rgba(17, 24, 39, 0.9)', titleFont: { size: 14 }, bodyFont: { size: 14 }, borderColor: '#374151', borderWidth: 1 }
                    },
                    scales: {
                        y: { 
                            min: 0, 
                            max: 350, 
                            title: { display: true, text: 'VELOCIDAD (KM/H)', color: '#6b7280', font: { size: 10, weight: 'bold' } },
                            grid: { color: '#1f2937' } // Cuadrícula oscura
                        },
                        x: { 
                            ticks: { maxTicksLimit: 20 }, 
                            title: { display: true, text: 'DISTANCIA EN PISTA (METROS)', color: '#6b7280', font: { size: 10, weight: 'bold' } },
                            grid: { color: '#1f2937' } // Cuadrícula oscura
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
